apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 1. Gateway NetworkPolicy: Receives Ingress from Dashboard / Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dashboard
        - namespaceSelector: {} # Allow traffic from Ingress controller namespace
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
---
# 2. WooCommerce MCP NetworkPolicy: STRICTLY internal; ONLY Gateway is permitted ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-woocommerce-mcp
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: woocommerce-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.woocommerceMcp.port }}
---
# 3. Inventory MCP NetworkPolicy: STRICTLY internal; ONLY Gateway is permitted ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inventory-mcp
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: inventory-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.inventoryMcp.port }}
---
# 4. Shipping MCP NetworkPolicy: STRICTLY internal; ONLY Gateway is permitted ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-shipping-mcp
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: shipping-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.shippingMcp.port }}
---
# 5. WordPress NetworkPolicy: Storefront Ingress + internal REST API from WooCommerce MCP
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wordpress
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: woocommerce-mcp
        - namespaceSelector: {} # Ingress controller for storefront
      ports:
        - protocol: TCP
          port: 80
---
# 6. MariaDB NetworkPolicy: ONLY WordPress and Bootstrap Job can access database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mariadb
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
        - podSelector:
            matchLabels:
              app: bootstrap-woocommerce
      ports:
        - protocol: TCP
          port: 3306
---
# 7. Postgres NetworkPolicy: ONLY Gateway can access gateway database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 5432
---
# 8. Dashboard NetworkPolicy: Receives Ingress from Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {} # Ingress controller
      ports:
        - protocol: TCP
          port: 80
