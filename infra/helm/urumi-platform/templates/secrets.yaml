apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.mariadbRootPassword | quote }}
  MARIADB_PASSWORD: {{ .Values.secrets.mariadbUserPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-credentials
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: storefront
type: Opaque
stringData:
  WORDPRESS_ADMIN_PASSWORD: {{ .Values.secrets.wordpressAdminPassword | quote }}
  WORDPRESS_DB_PASSWORD: {{ .Values.secrets.mariadbUserPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-api-credentials
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
type: Opaque
stringData:
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.secrets.woocommerceConsumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.secrets.woocommerceConsumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-credentials
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  INITIAL_ADMIN_EMAIL: {{ .Values.secrets.initialAdminEmail | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.secrets.initialAdminPassword | quote }}
